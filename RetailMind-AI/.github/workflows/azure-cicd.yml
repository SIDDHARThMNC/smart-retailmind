name: RetailMind AI — Build & Deploy to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r RetailMind-AI/requirements.txt

      # ── 4. Run tests ──────────────────────────────────────────────────────
      # continue-on-error: true so missing secrets don't block deployment.
      # Test results are still visible in the Actions log.
      - name: Run pytest
        continue-on-error: true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: retailmind
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt-4.1-mini
          AZURE_OPENAI_API_VERSION: 2025-01-01-preview
          APP_ROOT: ${{ github.workspace }}/RetailMind-AI
          PYTHONPATH: ${{ github.workspace }}/RetailMind-AI
        run: |
          cd RetailMind-AI
          python -m pytest backend/tests/ -v --tb=short --no-header

      # ── 5. Build deployment package ───────────────────────────────────────
      # Package the RetailMind-AI subfolder so that requirements.txt,
      # startup.txt, backend/, and data/ are all at the package root.
      # Azure Web App will see requirements.txt at / and startup.txt at /.
      - name: Build deployment zip
        run: |
          cd RetailMind-AI
          zip -r ../deploy.zip . \
            -x "*.pyc" \
            -x "*__pycache__*" \
            -x "*.pytest_cache*" \
            -x ".venv/*" \
            -x "screenshots/*" \
            -x "backend/tests/*" \
            -x "*.log"

      # ── 6. Deploy to Azure Web App ────────────────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: retailmind
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
