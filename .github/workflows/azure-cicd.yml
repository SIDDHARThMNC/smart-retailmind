# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure:
# https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service:
# https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - retailmind-sprint-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r RetailMind-AI/requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            RetailMind-AI/
            !RetailMind-AI/.venv/
            !RetailMind-AI/__pycache__/
            !RetailMind-AI/.pytest_cache/
            !RetailMind-AI/tests/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_63E1A21018394D6BB1A252D1D03D80C7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8AA7FC7C8C064DAE89786CE15E461EA7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F2D66DA0AEB447BBFD08BE4E5AFB8C9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: retailmind-sprint-app
          slot-name: Production
          package: .
